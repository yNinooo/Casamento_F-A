<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Presentes — Ana & Pedro</title>

  <!-- Google Fonts: Cormorant Garamond (elegante) + Jost (moderno) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       TOKENS & RESET
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bege:       #f5f0e8;
      --bege-medio: #ede5d6;
      --bege-escuro: #d6c9b0;
      --branco:     #fdfbf7;
      --dourado:    #b8964e;
      --dourado-claro: #d4af6f;
      --dourado-brilho: #e8c97e;
      --rose:       #c4808a;
      --rose-claro: #e8b4bc;
      --oliva:      #7a8c6e;
      --oliva-claro:#a4b896;
      --texto:      #3a3228;
      --texto-suave:#6b5e50;
      --sombra:     rgba(90, 70, 40, 0.10);
      --sombra-hover: rgba(90, 70, 40, 0.20);

      --fonte-display: 'Cormorant Garamond', Georgia, serif;
      --fonte-body:    'Jost', sans-serif;

      --radius: 20px;
      --radius-sm: 12px;
      --transition: 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bege);
      color: var(--texto);
      font-family: var(--fonte-body);
      font-weight: 300;
      line-height: 1.7;
    }

    /* ============================================================
       SEÇÃO HERO
    ============================================================ */
    .presentes-hero {
      text-align: center;
      padding: 100px 24px 60px;
      position: relative;
      overflow: hidden;
    }

    /* Fundo decorativo em grain suave */
    .presentes-hero::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(200,165,100,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(196,128,138,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Ornamento central */
    .hero-ornamento {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      animation: fadeDown 0.8s ease both;
    }
    .hero-ornamento .linha {
      width: 80px; height: 1px;
      background: linear-gradient(to right, transparent, var(--dourado));
    }
    .hero-ornamento .linha:last-child {
      background: linear-gradient(to left, transparent, var(--dourado));
    }
    .hero-ornamento .icon {
      font-size: 22px;
      color: var(--dourado);
    }

    .presentes-hero h2 {
      font-family: var(--fonte-display);
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--texto);
      line-height: 1.1;
      animation: fadeDown 0.9s 0.1s ease both;
    }
    .presentes-hero h2 em {
      font-style: italic;
      color: var(--dourado);
    }

    .presentes-hero .subtitulo {
      margin: 20px auto 0;
      max-width: 580px;
      font-size: 1rem;
      font-weight: 300;
      color: var(--texto-suave);
      line-height: 1.8;
      animation: fadeDown 1s 0.2s ease both;
    }

    /* ============================================================
       GRID DE CARDS
    ============================================================ */
    .presentes-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    /* ============================================================
       CARD
    ============================================================ */
    .card {
      background: var(--branco);
      border-radius: var(--radius);
      box-shadow: 0 4px 20px var(--sombra);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      transition: transform var(--transition), box-shadow var(--transition);
      animation: cardEntrada 0.6s ease both;
    }

    /* Entrada escalonada por index via JS */
    .card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 14px 40px var(--sombra-hover);
    }

    /* Faixa colorida no topo do card (stripe) */
    .card-stripe {
      height: 5px;
      width: 100%;
      background: linear-gradient(90deg, var(--rose), var(--dourado));
      flex-shrink: 0;
    }

    /* Ilustração SVG inline */
    .card-ilustracao {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bege);
      position: relative;
      overflow: hidden;
    }
    .card-ilustracao img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .card:hover .card-ilustracao img {
      transform: scale(1.06);
    }

    /* Etiqueta de valor flutuante */
    .card-valor-badge {
      position: absolute;
      top: 14px; right: 14px;
      background: linear-gradient(135deg, var(--dourado), var(--dourado-brilho));
      color: #fff;
      font-family: var(--fonte-body);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 5px 12px;
      border-radius: 100px;
      box-shadow: 0 2px 10px rgba(184,150,78,0.3);
    }

    /* Corpo do card */
    .card-body {
      padding: 20px 24px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-titulo {
      font-family: var(--fonte-display);
      font-size: 1.35rem;
      font-weight: 500;
      line-height: 1.25;
      color: var(--texto);
      margin-bottom: 10px;
    }

    .card-descricao {
      font-size: 0.875rem;
      color: var(--texto-suave);
      line-height: 1.7;
      flex: 1;
      font-style: italic;
    }

    /* Rodapé do card */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--bege-medio);
    }

    .card-valor {
      font-family: var(--fonte-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--dourado);
      letter-spacing: -0.01em;
    }

    /* Botão Presentear */
    .btn-presentear {
      background: linear-gradient(135deg, var(--rose), var(--rose-claro));
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 100px;
      font-family: var(--fonte-body);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.2s;
      position: relative;
      overflow: hidden;
    }
    .btn-presentear::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.15);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-presentear:hover {
      box-shadow: 0 6px 20px rgba(196,128,138,0.4);
      transform: translateY(-1px);
    }
    .btn-presentear:hover::after { opacity: 1; }
    .btn-presentear:active { transform: translateY(0); }
    .btn-presentear:focus-visible {
      outline: 3px solid var(--rose);
      outline-offset: 3px;
    }

    /* Coração animado no hover do card */
    .card::after {
      content: '♥';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%) scale(0);
      font-size: 60px;
      color: rgba(196,128,138,0.15);
      pointer-events: none;
      transition: transform 0.4s ease, opacity 0.4s ease;
      opacity: 0;
    }
    .card:hover::after {
      transform: translate(-50%,-50%) scale(2.5);
      opacity: 1;
    }

    /* ============================================================
       MODAL
    ============================================================ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(30, 20, 10, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.ativo {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--branco);
      border-radius: var(--radius);
      max-width: 440px;
      width: 100%;
      max-height: calc(100vh - 40px);
      max-height: calc(100dvh - 40px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 80px rgba(30,20,10,0.25);
      overflow: hidden;
      transform: scale(0.92) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.34,1.4,0.64,1), opacity 0.3s ease;
      opacity: 0;
    }
    .modal-overlay.ativo .modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* Cabeçalho do modal */
    .modal-header {
      background: linear-gradient(135deg, var(--bege-medio), var(--bege));
      padding: 8px 28px 10px;
      text-align: center;
      border-bottom: 1px solid var(--bege-escuro);
      position: relative;
      flex-shrink: 0;
    }
    .modal-header .modal-icon {
      font-size: 36px;
      display: block;
      margin-bottom: 0px;
    }
    .modal-header h3 {
      font-family: var(--fonte-display);
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--texto);
      line-height: 1.2;
    }
    .modal-header .modal-valor {
      display: inline-block;
      margin-top: 0px;
      font-family: var(--fonte-display);
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--dourado);
    }

    /* Botão fechar */
    .modal-fechar {
      position: absolute;
      top: 14px; right: 14px;
      background: none;
      border: 1px solid var(--bege-escuro);
      color: var(--texto-suave);
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .modal-fechar:hover {
      background: var(--bege-escuro);
      color: var(--texto);
    }
    .modal-fechar:focus-visible {
      outline: 3px solid var(--rose);
      outline-offset: 2px;
    }

    /* Corpo do modal */
    .modal-body {
      padding: 28px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }

    /* Coraçõezinhos decorativos no rodapé do modal */
    .modal-coracoes {
      text-align: center;
      padding: 8px 16px;
      border-top: 1px solid var(--bege-medio);
      flex-shrink: 0;
      font-size: 1.2rem;
      letter-spacing: 4px;
    }

    /* Área do QR Code */
    .qr-area {
      background: var(--bege);
      border: 2px dashed var(--bege-escuro);
      border-radius: var(--radius-sm);
      padding: 28px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .qr-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--texto-suave);
    }
    .qr-placeholder .qr-icon {
      font-size: 48px;
      opacity: 0.3;
    }
    .qr-placeholder p {
      font-size: 0.8rem;
      font-style: italic;
      max-width: 200px;
      line-height: 1.5;
    }

    /* Campo da chave PIX */
    .pix-campo {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .pix-input {
      flex: 1;
      background: var(--bege);
      border: 1px solid var(--bege-escuro);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-family: var(--fonte-body);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--texto-suave);
      letter-spacing: 0.03em;
      outline: none;
      cursor: default;
      user-select: all;
    }
    .btn-copiar {
      background: linear-gradient(135deg, var(--oliva), var(--oliva-claro));
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-family: var(--fonte-body);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      transition: box-shadow 0.2s, transform 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-copiar:hover {
      box-shadow: 0 4px 16px rgba(122,140,110,0.35);
      transform: translateY(-1px);
    }
    .btn-copiar.copiado {
      background: linear-gradient(135deg, var(--dourado), var(--dourado-brilho));
    }
    .btn-copiar:focus-visible {
      outline: 3px solid var(--oliva);
      outline-offset: 2px;
    }

    /* ============================================================
       TOAST "PIX copiado!"
    ============================================================ */
    .toast {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--texto);
      color: var(--bege);
      padding: 12px 28px;
      border-radius: 100px;
      font-family: var(--fonte-body);
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      z-index: 2000;
      white-space: nowrap;
    }
    .toast.visivel {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================================
       RODAPÉ DA SEÇÃO
    ============================================================ */
    .presentes-rodape {
      text-align: center;
      padding: 0 24px 80px;
    }
    .presentes-rodape .dica {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--branco);
      border: 1px solid var(--bege-escuro);
      border-radius: 100px;
      padding: 12px 24px;
      font-size: 0.82rem;
      font-weight: 300;
      color: var(--texto-suave);
      box-shadow: 0 2px 12px var(--sombra);
    }

    /* ============================================================
       CARDS PREMIUM
    ============================================================ */
    .card.premium {
      position: relative;
    }
    .card.premium::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: calc(var(--radius) + 2px);
      background: linear-gradient(135deg,
        var(--dourado-brilho),
        var(--rose-claro),
        var(--dourado),
        var(--dourado-claro));
      background-size: 300% 300%;
      animation: gradientePremium 4s ease infinite;
      z-index: -1;
    }
    @keyframes gradientePremium {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .card.premium .card-stripe {
      background: linear-gradient(90deg,
        var(--dourado-brilho), var(--dourado),
        var(--rose-claro), var(--dourado-brilho));
      background-size: 200% 100%;
      animation: stripeSlide 3s linear infinite;
      height: 6px;
    }
    @keyframes stripeSlide {
      from { background-position: 0% 0%; }
      to   { background-position: 200% 0%; }
    }
    .badge-premium {
      position: absolute;
      top: 14px; left: 14px;
      background: linear-gradient(135deg, var(--dourado), var(--dourado-brilho));
      color: #fff;
      font-family: var(--fonte-body);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 100px;
      box-shadow: 0 2px 8px rgba(184,150,78,0.35);
      display: flex; align-items: center; gap: 5px;
    }
    .card.premium .card-valor {
      font-size: 1.7rem;
      background: linear-gradient(135deg, var(--dourado), var(--dourado-brilho));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card.premium .btn-presentear {
      background: linear-gradient(135deg, var(--dourado), var(--dourado-brilho));
    }
    .card.premium .btn-presentear:hover {
      box-shadow: 0 6px 20px rgba(184,150,78,0.45);
    }

    /* ============================================================
       ANIMAÇÕES
    ============================================================ */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardEntrada {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       RESPONSIVO
    ============================================================ */
    @media (max-width: 600px) {
      .presentes-grid { gap: 18px; padding: 10px 14px 60px; }
      .modal-body { padding: 20px 18px; }
      .pix-campo { flex-direction: column; }
    }
  </style>
</head>

<body>

      <!-- Coraçõezinhos decorativos -->

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite">✓ Chave PIX copiada!</div>

      // ═══════════════════════════════════════════

    /* ──────────────────────────────────────────────
       RENDERIZAR OS CARDS
    ────────────────────────────────────────────── */
    const grade = document.getElementById('grade-presentes');

    presentes.forEach((p, index) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.setAttribute('role', 'listitem');
      card.style.animationDelay = `${index * 0.07}s`;
      if (p.premium) card.classList.add('premium');

      // Stripe com cor personalizada por card (alterna)
      const stripeColors = [
        'linear-gradient(90deg, var(--rose), var(--dourado))',
        'linear-gradient(90deg, var(--dourado), var(--oliva-claro))',
        'linear-gradient(90deg, var(--oliva), var(--rose-claro))',
        'linear-gradient(90deg, var(--rose-claro), var(--dourado-claro))',
      ];

      card.innerHTML = `
        <div class="card-stripe" style="background: ${stripeColors[index % stripeColors.length]};"></div>
        <div class="card-ilustracao">
          <img class="card-imagem" src="${p.imagem}" alt="${p.titulo}" loading="lazy" />
          <span class="card-valor-badge" aria-hidden="true">R$ ${p.valor}</span>
          ${p.premium ? '<span class="badge-premium" aria-label="Presente especial">❤</span>' : ''}
        </div>
        <div class="card-body">
          <h3 class="card-titulo">${p.emoji} ${p.titulo}</h3>
          <p class="card-descricao">${p.descricao}</p>
          <div class="card-footer">
            <span class="card-valor" aria-label="Valor: R$ ${p.valor}">R$ ${p.valor}</span>
            <button
              class="btn-presentear"
              aria-label="Presentear com ${p.titulo} no valor de R$ ${p.valor}"
              data-id="${p.id}"
            >
              Presentear ♡
            </button>
          </div>
        </div>
      `;

      // Abrir modal ao clicar no card (mas não no botão pois o botão já tem listener)
      card.addEventListener('click', (e) => {
        if (!e.target.closest('.btn-presentear')) {
          abrirModal(p.id);
        }
      });

      // Listener no botão presentear
      card.querySelector('.btn-presentear').addEventListener('click', (e) => {
        e.stopPropagation();
        abrirModal(p.id);
      });

      grade.appendChild(card);
    });


    /* ──────────────────────────────────────────────
       MODAL
    ────────────────────────────────────────────── */
    const overlay    = document.getElementById('modal-overlay');
    const modalEl    = document.getElementById('modal');
    const modalIcon  = document.getElementById('modal-icon');
    const modalTit   = document.getElementById('modal-titulo');
    const modalValor = document.getElementById('modal-valor');
    const pixInput   = document.getElementById('pix-input');
    const btnFechar  = document.getElementById('modal-fechar');
    const btnCopiar  = document.getElementById('btn-copiar');

    // Chave PIX do casal — altere aqui!
    const CHAVE_PIX = 'sua-chave-pix@email.com';

    function abrirModal(id) {
      const presente = presentes.find(p => p.id === id);
      if (!presente) return;

      modalIcon.textContent  = presente.emoji;
      modalTit.textContent   = presente.titulo;
      modalValor.textContent = `R$ ${presente.valor}`;
      pixInput.value         = CHAVE_PIX;

      // Reset botão copiar
      btnCopiar.textContent = '⎘ Copiar PIX';
      btnCopiar.classList.remove('copiado');

      overlay.classList.add('ativo');
      overlay.setAttribute('aria-hidden', 'false');
      btnFechar.focus();

      // Bloquear scroll do body
      document.body.style.overflow = 'hidden';
    }

    function fecharModal() {
      overlay.classList.remove('ativo');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    btnFechar.addEventListener('click', fecharModal);

    // Fechar clicando fora do modal
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) fecharModal();
    });

    // Fechar com ESC
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('ativo')) {
        fecharModal();
      }
    });

    /* ──────────────────────────────────────────────
       COPIAR PIX
    ────────────────────────────────────────────── */
    const toast = document.getElementById('toast');

    btnCopiar.addEventListener('click', () => {
      const texto = pixInput.value;

      // Tenta API Clipboard moderna primeiro
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(mostrarToast).catch(copiarFallback);
      } else {
        copiarFallback();
      }
    });

    function copiarFallback() {
      // Fallback para execCommand (legado)
      pixInput.select();
      pixInput.setSelectionRange(0, 99999);
      try {
        document.execCommand('copy');
        mostrarToast();
      } catch (err) {
        console.error('Falha ao copiar:', err);
      }
    }

    function mostrarToast() {
      // Atualiza botão
      btnCopiar.innerHTML = '✓ Copiado!';
      btnCopiar.classList.add('copiado');
      setTimeout(() => {
        btnCopiar.innerHTML = '⎘ Copiar PIX';
        btnCopiar.classList.remove('copiado');
      }, 3000);

      // Mostra toast
      toast.classList.add('visivel');
      setTimeout(() => toast.classList.remove('visivel'), 2800);
    }
  </script>
